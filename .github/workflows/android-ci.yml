name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-and-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
        env:
          NEWS_API_KEY: ci_placeholder_news_key
          MAPS_API_KEY: ci_placeholder_maps_key

      - name: Lint
        run: ./gradlew lintDebug --stacktrace
        env:
          NEWS_API_KEY: ci_placeholder_news_key
          MAPS_API_KEY: ci_placeholder_maps_key

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace
        env:
          NEWS_API_KEY: ci_placeholder_news_key
          MAPS_API_KEY: ci_placeholder_maps_key

  release-r8:
    runs-on: ubuntu-latest
    needs: unit-and-debug
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble release (R8, unsigned when no keystore)
        run: ./gradlew assembleRelease --stacktrace
        env:
          NEWS_API_KEY: ci_placeholder_news_key
          MAPS_API_KEY: ci_placeholder_maps_key
