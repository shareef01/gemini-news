name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-and-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (includes Robolectric Room 4→5 migration)
        run: ./gradlew testDebugUnitTest --stacktrace
        env:
          NEWS_API_KEY: "ci_placeholder_news_key"
          MAPS_API_KEY: "ci_placeholder_maps_key"

      - name: Lint
        run: ./gradlew lintDebug --stacktrace
        env:
          NEWS_API_KEY: "ci_placeholder_news_key"
          MAPS_API_KEY: "ci_placeholder_maps_key"

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace
        env:
          NEWS_API_KEY: "ci_placeholder_news_key"
          MAPS_API_KEY: "ci_placeholder_maps_key"

  instrumented:
    runs-on: ubuntu-latest
    needs: unit-and-debug
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests (API 34 emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace
        env:
          NEWS_API_KEY: "ci_placeholder_news_key"
          MAPS_API_KEY: "ci_placeholder_maps_key"

  release-r8:
    runs-on: ubuntu-latest
    needs: unit-and-debug
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble release (R8, unsigned when no keystore)
        run: ./gradlew assembleRelease --stacktrace
        env:
          NEWS_API_KEY: "ci_placeholder_news_key"
          MAPS_API_KEY: "ci_placeholder_maps_key"

      - name: Assert release APK excludes App Check debug registrar
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          TMP=$(mktemp -d)
          unzip -q "$APK" -d "$TMP"
          if strings "$TMP"/classes*.dex | grep -q 'FirebaseAppCheckDebugRegistrar'; then
            echo "ERROR: Debug App Check registrar found in release dex" >&2
            exit 1
          fi
          echo "OK: no FirebaseAppCheckDebugRegistrar in release APK"
